# Configuração para hospedar o Frontend na Netlify apontando a API para o seu backend (Render / Railway)
[build]
  publish = "app/static"

# Substitua https://SEU-BACKEND.onrender.com pela URL gerada no Render ou Railway
[[redirects]]
  from = "/api/*"
  to = "https://classic-car-hunter.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
